#############################################################################################################
### CONFIGURATION GENERATED BY THE RATOS CONFIGURATOR
### Everything below [include RatOS.cfg] will override default RatOS behavior
#############################################################################################################
[include RatOS.cfg]

#############################################################################################################
### MACRO CONFIGURATION
### Configure the behavior of RatOS macros
### See: https://os.ratrig.com/docs/configuration/macros
#############################################################################################################
[gcode_macro RatOS]
variable_relative_extrusion: True
variable_preheat_extruder: True
variable_calibrate_bed_mesh: True
variable_nozzle_priming: "primeblob"
variable_start_print_park_in: "center"
variable_start_print_park_z_height: 3
variable_end_print_park_in: "back"
variable_pause_print_park_in: "back"
variable_beacon_scan_compensation_enable: True
variable_beacon_scan_compensation_profile: "auto"
variable_shaper_x_freq: [51.0, 50.4, 53.4, 52.0]       # shaper frequency [T0, T1, COPY, MIRROR]
variable_shaper_y_freq: [56.4, 51.8, 51.2, 52.0]       # shaper frequency [T0, T1, COPY, MIRROR]
variable_shaper_x_type: ["mzv", "mzv", "mzv", "mzv"]   # shaper frequency algorythm [T0, T1, COPY, MIRROR]
variable_shaper_y_type: ["mzv", "mzv", "mzv", "mzv"]   # shaper frequency algorythm [T0, T1, COPY, MIRROR]
variable_chamber_filter_enable: True                     # True|False = enable chamber filter control
variable_chamber_filter_speed: 1.0                       # float = chamber filter fan speed.
variable_chamber_filter_disable_speed: 1.0               # float = chamber filter fan speed after the print has finished.
variable_chamber_filter_enable_at: "after_print_start"   # before_print_start|after_print_start|print_end = when to enable the filter
variable_chamber_filter_disable_period: 300              # int = disable fan after X seconds after the print ends
variable_chamber_filter_disable_bed_temp: 0              # int = wait for X°C bed temp after the print ends before disabling the filter


#############################################################################################################
### USER OVERRIDES & CUSTOM CONFIGURATION
### Anything custom you want to add, or RatOS configuration you want to override, do it here.
### This section is pre-populated with the most common settings you may want to change.
### See: https://os.ratrig.com/docs/configuration/includes-and-overrides
###
### It is recommended that you follow these steps to properly calibrate your printer:
### 0) Sanity check and PID Tuning: https://www.klipper3d.org/Config_checks.html
### 1) Z-offset calibration: run BEACON_RATOS_CALIBRATE to automatically calibrate your beacon for scan and contact.
###    IMPORTANT: Ensure the beacon is properly mounted and the nozzle and meltzone is clean by unloading
###    the filament (if it's loaded) and make sure there's no ooze or gunk on the nozzle when the hotend is at printing temperature.
### 2) Pressure Advance: https://www.klipper3d.org/Pressure_Advance.html
### 3) Skew Correction: https://www.klipper3d.org/Skew_Correction.html
### 4) Resonance Compensation: https://www.klipper3d.org/Resonance_Compensation.html
### RatOS has dedicated macro's to generate shaper graphs for deeper analysis (requires accelerometer).
### Use MEASURE_COREXY_BELT_TENSION to compare tension between belts, and use
### GENERATE_SHAPER_GRAPHS to generate the resonance graphs for analysing and manually entering input shaper
### configuration.
### You can run SHAPER_CALIBRATE to automatically calibrate your input shaper configuration, if you just want
### to get started.
### Additionally, you can use the Realtime Analysis Tool to analyze your printer's performance in real-time.
### Read more about klipper here: https://www.klipper3d.org/Overview.html
#############################################################################################################

[gcode_macro _IDLE_WATCH]
description: Drops the idle extruder by drop_c after idle_seconds (IDEX single mode, while printing)
variable_idle_seconds: 900
variable_drop_c: 40
variable_tick: 30
variable_t0_idle: 0
variable_t1_idle: 0
variable_t0_dropped: 0
variable_t1_dropped: 0
gcode:
  {% set me = printer["gcode_macro _IDLE_WATCH"] %}
  {% set printing = printer.print_stats.state == 'printing'
        and printer["gcode_macro START_PRINT"].is_printing_gcode|default(false)|lower == 'true' %}
  {% set single = printer["dual_carriage"] is defined
        and printer["dual_carriage"].carriage_1|lower in ['primary', 'inactive'] %}
  {% set active = 1 if printer.toolhead.extruder == 'extruder1' else 0 %}
  {% for t in [0, 1] %}
    {% set heater = 'extruder' if t == 0 else 'extruder1' %}
    {% set idle = me['t%d_idle' % t]|float %}
    {% set dropped = me['t%d_dropped' % t]|int %}
    {% set tgt = printer[heater].target|float %}
    {% if not (printing and single) or t == active or tgt <= 0 %}
      SET_GCODE_VARIABLE MACRO=_IDLE_WATCH VARIABLE=t{t}_idle VALUE=0
      SET_GCODE_VARIABLE MACRO=_IDLE_WATCH VARIABLE=t{t}_dropped VALUE=0
    {% elif dropped == 0 %}
      {% set n = idle + me.tick|float %}
      {% if n >= me.idle_seconds|float %}
        RATOS_ECHO MSG="T{t} idle for {me.idle_seconds|int}s, lowering heater by {me.drop_c|int}C"
        SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=standby VALUE=True
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET={[tgt - me.drop_c|float, 0]|max}
        SET_GCODE_VARIABLE MACRO=_IDLE_WATCH VARIABLE=t{t}_dropped VALUE=1
        SET_GCODE_VARIABLE MACRO=_IDLE_WATCH VARIABLE=t{t}_idle VALUE=0
      {% else %}
        SET_GCODE_VARIABLE MACRO=_IDLE_WATCH VARIABLE=t{t}_idle VALUE={n}
      {% endif %}
    {% endif %}
  {% endfor %}

[delayed_gcode _IDLE_WATCH_LOOP]
initial_duration: 30
gcode:
  _IDLE_WATCH
  UPDATE_DELAYED_GCODE ID=_IDLE_WATCH_LOOP DURATION={printer["gcode_macro _IDLE_WATCH"].tick}

[neopixel vaoc_led]
pin: PB6
chain_count: 6
color_order: GRB
 
[heater_fan vaoc_fan]
pin: PA3
heater: heater_bed
fan_speed: 1.0
heater_temp: 50

# Controller cooling fan
[controller_fan controller_fan]
# 2-pin fan connected to 2-pin header on Octopus V1.1 F446 - input voltage pwm
pin: PA2

# Rat Rig Dayspring
# Rat Rig Dayspring LED strips by Vector3D
[led chamber]
white_pin: PB10
initial_WHITE: 0.5

# Turn the chamber lights off when a print finishes (RatOS end-print hook)
[gcode_macro _USER_END_PRINT_FINISHED]
gcode:
  SET_LED LED=chamber WHITE=0

# Rat Rig Rat Pack
# The Rat Pack chamber air filter
[fan_generic filter]
pin: PB11
enable_pin: PE11

#---------------------------------------------------- X -----------------------------------------------------
# The X axis motor for the left toolhead, located at the rear left of the printer
#------------------------------------------------------------------------------------------------------------
[stepper_x]
dir_pin: x_dir_pin                # Add ! in front of pin name to reverse the direction of stepper_x
rotation_distance: 40             # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
homing_speed: 50
position_min: -60.6
position_max: 400
position_endstop: -60.6

#---------------------------------------------- DUAL_CARRIAGE -----------------------------------------------
# The X axis motor for the right toolhead, located at the rear right of the printer
#------------------------------------------------------------------------------------------------------------
[dual_carriage]
dir_pin: dual_carriage_dir_pin    # Add ! in front of pin name to reverse the direction of dual_carriage
rotation_distance: 40             # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
position_min: 0
position_max: 460.6
position_endstop: 460.6
safe_distance: 55

#---------------------------------------------------- Y -----------------------------------------------------
# The left Y motor used for cartesian Y control in Hybrid CoreXY, located at the rear left of the printer
#------------------------------------------------------------------------------------------------------------
[stepper_y]
dir_pin: !y_dir_pin               # Remove ! in front of pin name to reverse the direction of stepper_y
rotation_distance: 40             # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
homing_speed: 50
position_min: -14.35
position_max: 433.65
position_endstop: -14.35

#---------------------------------------------------- Y1 ----------------------------------------------------
# The right Y motor used for cartesian Y control in Hybrid CoreXY, located at the rear right of the printer
#------------------------------------------------------------------------------------------------------------
[stepper_y1]
dir_pin: y1_dir_pin               # Add ! in front of pin name to reverse the direction of stepper_y1
rotation_distance: 40             # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys

#---------------------------------------------------- Z -----------------------------------------------------
# The left Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z]
dir_pin: !z0_dir_pin              # Remove ! in front of pin name to reverse the direction of stepper_z
rotation_distance: 4              # 4 for TR8*4 lead screws
homing_speed: 10
position_min: -7
position_max: 400

#---------------------------------------------------- Z1 ----------------------------------------------------
# The rear Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z1]
dir_pin: !z1_dir_pin              # Remove ! in front of pin name to reverse the direction of stepper_z1
rotation_distance: 4              # 4 for TR8*4 lead screws

#---------------------------------------------------- Z2 ----------------------------------------------------
# The right Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z2]
dir_pin: !z2_dir_pin              # Remove ! in front of pin name to reverse the direction of stepper_z2
rotation_distance: 4              # 4 for TR8*4 lead screws

#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for pushing filament through the left toolhead (T0)
#------------------------------------------------------------------------------------------------------------
[extruder]
dir_pin: toolboard_t0:e_dir_pin   # Add ! in front of pin name to reverse the direction of extruder
rotation_distance: 4.63           # Orbiter 2 default
#pressure_advance: 0.05           # Check https://www.klipper3d.org/Pressure_Advance.html for pressure advance tuning.
#control: pid
#pid_kp: 28.413
#pid_ki: 1.334
#pid_kd: 151.300

#------------------------------------------------ EXTRUDER1 -------------------------------------------------
# The extruder motor used for pushing filament through the right toolhead (T1)
#------------------------------------------------------------------------------------------------------------
[extruder1]
dir_pin: toolboard_t1:e_dir_pin   # Add ! in front of pin name to reverse the direction of extruder1
rotation_distance: 4.63           # Orbiter 2 default
#pressure_advance: 0.05           # Check https://www.klipper3d.org/Pressure_Advance.html for pressure advance tuning.
#control: pid
#pid_kp: 28.413
#pid_ki: 1.334
#pid_kd: 151.300

[firmware_retraction]
retract_length: 0.8

########################################
# Configuration Helpers for Rat Rig VAOC
########################################
#
# These includes must come after any user-defined stepper sections
# to ensure that overrides work correctly.
#
[include ratos_generated/dc-endstop.cfg]   # Managed by CONFIGURE_DC_ENDSTOP macro
[include ratos_generated/adjust-y-max.cfg] # Managed by INCREASE_Y_MAX macro




